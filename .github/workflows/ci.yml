name: CI

on:
  push:
    branches: [main, feature/eyes-ambient]
  pull_request:
    branches: [main, feature/eyes-ambient]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check sdk scripts

      - name: Ruff format check
        run: uv run ruff format --check sdk scripts

      - name: Validate profiles
        run: uv run python scripts/validate_profiles.py

      - name: Pytest
        run: uv run pytest sdk/tests -q

      - name: Build eyes assets
        run: |
          uv run python scripts/generate_eyes_art.py
          uv run python -c "from pathlib import Path; from nomabot.assets.compiler import compile_pack; compile_pack(Path('assets/characters/eyes'), Path('compiled/eyes'), 'lilygo_tdisplay_s3_landscape')"
          uv run python scripts/copy_pack_to_firmware_data.py

  firmware:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Build eyes assets for LittleFS
        run: |
          uv run python scripts/generate_eyes_art.py
          uv run python -c "from pathlib import Path; from nomabot.assets.compiler import compile_pack; compile_pack(Path('assets/characters/eyes'), Path('compiled/eyes'), 'lilygo_tdisplay_s3_landscape')"
          uv run python scripts/copy_pack_to_firmware_data.py

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e lilygo_tdisplay_s3
