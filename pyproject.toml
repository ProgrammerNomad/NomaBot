[project]
name = "eyes-ambient-workspace"
version = "0.6.0"
description = "Eyes Ambient - standalone ESP32 desk pet"
requires-python = ">=3.13"
dependencies = [
    "nomabot",
]

[tool.uv.sources]
nomabot = { workspace = true }

[tool.uv.workspace]
members = ["sdk"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["sdk/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests"]
